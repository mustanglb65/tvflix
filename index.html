<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Shatila Family Flixer</title>
<meta name="viewport" content="width=1920, user-scalable=no">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="topbar"><span class="logo">Shatila Family Flixer</span><span id="status"></span><div id="searchbtn" class="sbtn">&#128269; Search</div></div>

  <div id="search" class="hidden">
    <div id="search-title">Search movies &amp; shows</div>
    <input id="search-input" type="text" placeholder="Type a title, then press Enter / Done" autocomplete="off">
    <div id="search-hint">Press Back to cancel</div>
  </div>
  <div id="rows"><div id="rows-inner"></div></div>

  <div id="detail" class="hidden">
    <div id="detail-poster"></div>
    <div id="detail-info">
      <h1 id="detail-title"></h1>
      <p id="detail-desc"></p>
      <p id="detail-where"></p>
      <div id="detail-buttons">
        <div id="detail-play" class="btn focus">&#9654; Play</div>
        <div id="detail-trailer" class="btn hidden">&#127910; Trailer</div>
      </div>
    </div>
  </div>

  <div id="trailer" class="hidden">
    <iframe id="trailer-frame" src="about:blank" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
    <div id="trailer-hint">Press Back to close</div>
  </div>

  <div id="player" class="hidden">
    <div class="iframe-container">
      <iframe id="vidcore-frame" src="about:blank" frameborder="0" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
    </div>
    <video id="vid" class="hidden" preload="auto"></video>
    <div id="player-msg"></div>
    <div id="trailer-hint">Press Back to close</div>
  </div>
</div>
<div id="credit">This product uses the TMDB API but is not endorsed or certified by TMDB. Streaming data by JustWatch.</div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
