<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TVFlix</title>
<meta name="viewport" content="width=1920, user-scalable=no">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="topbar"><span class="logo">TVFLIX</span><span id="status"></span></div>
  <div id="rows"><div id="rows-inner"></div></div>

  <div id="detail" class="hidden">
    <div id="detail-poster"></div>
    <div id="detail-info">
      <h1 id="detail-title"></h1>
      <p id="detail-desc"></p>
      <div id="detail-play" class="btn focus">&#9654; Play</div>
    </div>
  </div>

  <div id="player" class="hidden">
    <video id="video"></video>
    <div id="player-msg"></div>
    <div id="player-bar"><div id="player-progress"></div></div>
  </div>
</div>
<div id="credit">This product uses the TMDB API but is not endorsed or certified by TMDB.</div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
